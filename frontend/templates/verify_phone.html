{% extends "dashboard_base.html" %}

{% load static %}

{% block title %}
    Verify Phone
{% endblock %}

{% block dashboard_content %}

<div class="verify-phone-page">

    <div class="verify-phone-card">

        <!-- Header -->
        <div class="verify-phone-header">

            <div class="verify-phone-icon">
                <i class="fa-solid fa-mobile-screen-button"></i>
            </div>

            <h2>Verify Phone Number</h2>

            <p>
                Enter the OTP sent to your phone number.
            </p>

        </div>


        <!-- OTP Form -->
        <form id="verifyPhoneForm">

            <div class="verify-phone-form-group">

                <label for="otp">
                    Enter OTP
                </label>

                <div class="verify-phone-input-wrapper">

                    <i class="fa-solid fa-key"></i>

                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        placeholder="Enter 6-digit OTP"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                    >

                </div>

            </div>


            <!-- Message -->
            <div
                id="verifyPhoneMessage"
                class="verify-phone-message"
            ></div>


            <!-- Buttons -->
            <div class="verify-phone-actions">

                <button
                    type="submit"
                    id="verifyOtpBtn"
                    class="verify-otp-btn"
                >
                    <i class="fa-solid fa-circle-check"></i>
                    Verify OTP
                </button>

                <button
                    type="button"
                    id="resendOtpBtn"
                    class="resend-otp-btn"
                >
                    <i class="fa-solid fa-rotate"></i>
                    Resend OTP
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}


{% block extra_css %}

<link
    rel="stylesheet"
    href="{% static 'css/verify_phone.css' %}"
>

{% endblock %}


{% block extra_js %}

<script
    src="{% static 'js/verify_phone.js' %}?v=2"
></script>

{% endblock %}
